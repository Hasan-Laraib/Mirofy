name: Publish

# Publishes `mirofy-cli` to npm when a version tag is pushed.
#
# WITH PROVENANCE, which is the reason this workflow exists rather than a
# `npm publish` from somebody's laptop. npm records, and shows on the package
# page, which repository and which commit built the tarball — a signed claim a
# reader can check rather than take on trust. That is the same thing this
# project asks of every diagram it draws, and it would be strange to ship the
# tool itself on nothing but "I ran it on my machine".
#
# BEFORE THIS CAN RUN, TWO ONE-TIME STEPS:
#
#   1. DONE -- mirofy-cli@0.1.0 was published by hand on 2026-09-01. npm has no
#      way to configure a trusted publisher for a package that does not exist
#      yet, so the first release always goes up manually.
#
#   2. DONE -- trusted publishing configured on npmjs.com:
#        Organization or user:  Hasan-Laraib
#        Repository:            Mirofy
#        Workflow filename:     publish.yml
#        Environment:           (blank -- this job declares none, and a value
#                                here would make every OIDC claim fail to match)
#
#      Package publishing access is "Require two-factor authentication and
#      disallow bypass 2FA tokens" -- npm's strictest, and the right one HERE
#      precisely because nothing in this repository publishes with a token.
#
#      The looser option exists to grandfather in granular tokens that bypass
#      2FA, which is the mechanism npm is deprecating. A trusted-publishing
#      credential is not one of those: it is minted per workflow run, expires in
#      minutes, and is bound to this repository and this file. Choosing the
#      looser setting would keep a door open that nothing here walks through.
#
# After that there is no npm token anywhere: the job proves who it is with a
# short-lived OIDC token GitHub mints for this workflow, and nothing long-lived
# has to be stored in repository secrets or rotated.
#
# To release: bump the version in packages/core/package.json, commit, then
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Mints the OIDC token that proves to npm this build came from this
      # repository and this workflow. Provenance does not work without it.
      id-token: write
    steps:
      # Full history: the renderer verifies source citations against the commit
      # they name, and the prepublish guard reads the working tree's state.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # The tag is the release. A tag that does not match the version being
      # published means somebody bumped one and forgot the other, and the
      # wrong number would be on npm permanently.
      - name: The tag and the manifest have to agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./packages/core/package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match ${manifest}" >&2
            exit 1
          fi
          echo "publishing $(node -p "require('./packages/core/package.json').name")@${manifest}"

      # A re-pushed tag should not be an error. The first release was published
      # by hand -- npm cannot configure a trusted publisher for a package that
      # does not exist yet -- so this workflow will meet a version that is
      # already on the registry, and "already published" is a true statement
      # about a successful release, not a failure.
      - name: Skip if this version is already on the registry
        id: already
        run: |
          name="$(node -p "require('./packages/core/package.json').name")"
          version="$(node -p "require('./packages/core/package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is already on the registry; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs the full gate, then packs the tarball and installs
      # it into a clean directory to check it actually renders. It is slow on
      # purpose: npm allows an unpublish for 72 hours and then the version
      # number is spent forever.
      # NO TOKEN, deliberately. This step used to pass NODE_AUTH_TOKEN from a
      # secret, left over from before trusted publishing existed here. It was
      # harmless only because the secret was never created -- and it was a trap:
      # npm prefers a token when one is present, so adding an NPM_TOKEN secret
      # for any reason would have silently replaced OIDC with the exact kind of
      # long-lived credential trusted publishing was set up to avoid, and
      # provenance would have stopped appearing with no error to notice.
      #
      # Authentication comes from the OIDC token GitHub mints for this workflow.
      # If that is misconfigured this step fails loudly, which is the point.
      - name: Publish
        if: steps.already.outputs.published == 'false'
        run: npm publish --provenance --access public
        working-directory: packages/core
