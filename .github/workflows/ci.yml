name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Includes the matrix values in the group name: a bare `ci-check-<ref>`
    # group would be shared by every os/node combination in the matrix
    # below, so a newly-started combination would cancel an in-progress
    # *different* combination of the same push instead of only superseding
    # a stale run of its own combination.
    concurrency:
      group: ci-check-${{ github.ref }}-${{ matrix.os }}-${{ matrix.node }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The full gate chain (lint -> typecheck -> test -> test:golden ->
      # check:provenance -> test:conformance -> check:artifacts -> check:size ->
      # check:audit) is wired into the single "check" script in package.json.
      # Running it once here keeps this workflow from drifting out of sync
      # with that list instead of duplicating each step as its own `run:`
      # line.
      - run: npm run check

  browser:
    concurrency:
      group: ci-browser-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      # install-dependencies: true previously failed here: it apt-get installs
      # a hardcoded package list (libgconf-2-4, libasound2, ...) that predates
      # ubuntu-latest's current noble image, where those exact package names
      # no longer exist (libasound2 is now a virtual package provided by
      # libasound2t64; libgconf-2-4 is gone entirely) -- `sudo apt-get install`
      # exits 100 on the unresolvable name. ubuntu-latest already ships the
      # shared libraries a headless Chrome needs (it ships Chrome itself), so
      # the extra apt step is both unnecessary and, on this image, broken.
      - uses: browser-actions/setup-chrome@facf10a55b9caf92e0cc749b4f82bf8220989148 # v1.7.2
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      # setup-chrome unpacks Chrome into the tool cache without making
      # chrome-sandbox root-owned and setuid (mode 4755), so the SUID sandbox
      # helper is present but unusable and Chrome refuses to start at all:
      # "FATAL ... setuid_sandbox_host.cc:166 ... Rather than run without
      # sandboxing I'm aborting now." Every browser row then fails identically
      # with ECONNRESET on the DevTools pipe -- that is one launch failure
      # reported N times, not N separate test failures. visual-check.mjs
      # already exposes the supported opt-out (CHROME_NO_SANDBOX_ENV,
      # packages/core/bin/visual-check.mjs:22), which prepends --no-sandbox.
      # chown+chmod on the tool-cache binary would also work, but that mutates
      # the runner image instead of using the documented switch. The sandbox
      # isolates renderers from the host; the host here is a single-use CI VM
      # rendering our own fixtures.
      - name: Browser conformance
        env:
          MIROFY_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          MIROFY_CHROME_NO_SANDBOX: '1'
        run: npm run test:conformance
