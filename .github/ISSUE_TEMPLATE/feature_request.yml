name: Feature request
description: Something this should be able to do and cannot
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution. What does the diagram need to say that it currently cannot?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What do you do instead today
      description: |
        Even "nothing, I gave up" is useful — it tells us how far the gap goes. If you have a workaround, its shape often suggests where the real fix belongs.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What you imagine it looking like
      description: A flag, a schema key, a command. A rough guess is fine and will not be held against you.

  - type: checkboxes
    id: scope
    attributes:
      label: Before you post
      options:
        - label: I have read the "Scope" section of the README, and this is not one of the things this deliberately does not do.
          required: true
